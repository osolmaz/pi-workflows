typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src
    exclude:
      - "**/*.test.ts"
      - "dist/**"
      - "node_modules/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  dependency_boundaries:
    # workflows is the core engine; it must stay pi-agnostic and standalone.
    - from: src/workflows
      allow: []
    # Durable reconciliation may launch finite child workflows, never the reverse.
    - from: src/controllers
      allow:
        - src/workflows
    # Shared presentation: graph layout and terminal rendering, pi-agnostic.
    - from: src/render
      allow:
        - src/workflows
    # Built-ins compose package-owned definitions from the public engine.
    - from: src/builtins
      allow:
        - src/workflows
    # The extension embeds the engine in pi and draws the widget graph.
    - from: src/extension
      allow:
        - src/workflows
        - src/builtins
        - src/controllers
        - src/render
    # The host runs headlessly; it spawns pi but never embeds it.
    - from: src/host
      allow:
        - src/workflows
        - src/builtins
        - src/controllers
    # The viewer only reads run bundles and dispatches the host command; it
    # must never import the extension.
    - from: src/viewer
      allow:
        - src/workflows
        - src/controllers
        - src/render
        - src/host
