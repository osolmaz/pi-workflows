[package]
name = "pi-workflows"
version = "0.6.1"
edition = "2021"
description = "Terminal viewer and live replay server for pi-workflows run bundles"
license = "MIT"
readme = "README.md"
repository = "https://github.com/osolmaz/pi-workflows"
homepage = "https://github.com/osolmaz/pi-workflows"
documentation = "https://docs.rs/pi-workflows"
keywords = ["workflow", "terminal", "replay", "pi"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "piw"
path = "src/lib.rs"

[[bin]]
name = "piw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = "0.30"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
